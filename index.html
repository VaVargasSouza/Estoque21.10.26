<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque da Empresa</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>
        <h1>Estoque da Empresa</h1>
        <p>Cadastro e gerenciamento de itens</p>
    </header>

    <main>

        <section class="formulario">

            <h2 id="tituloFormulario">Cadastrar item</h2>

            <form id="formItem">

                <label for="nome">Nome do item:</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do item"
                    maxlength="100"
                    required
                >

                <label for="Qtde">Quantidade de itens:</label>
                <input
                    type="number"
                    id="Qtde"
                    min="0"
                    max="1000"
                    step="0.1"
                    placeholder="Quantidade"
                    required
                >

                <button type="submit" id="btnSalvar">
                    Cadastrar item
                </button>

                <button
                    type="button"
                    id="btnCancelar"
                    class="secundario"
                    hidden
                >
                    Cancelar edição
                </button>

            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>

        </section>

        <section class="lista">

            <h2>Itens cadastrados</h2>

            <div id="ListaItens">
                Carregando itens...
            </div>

        </section>

    </main>

    <footer>
        <p>Sistema de controle de estoque</p>
    </footer>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
